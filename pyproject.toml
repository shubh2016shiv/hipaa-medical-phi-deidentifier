[project]
name = "deid-patients"
version = "0.1.0"
description = "Patient data de-identification and dashboard tooling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "presidio-analyzer==2.2.355",
    "presidio-anonymizer==2.2.355",
    "spacy>=3.7.0",
    "en-core-web-lg>=3.8.0",
    "transformers>=4.43.0",
    "torch>=2.2.0",
    "regex",
    "pyyaml",
    "tabulate",
    "dash==2.14.1",
    "plotly==5.17.0",
    "pandas==2.1.1",
    "dash-bootstrap-components==1.5.0",
]

# ---------------------------------------------------------------------------
# Optional extras — for end-users who `pip install deid-patients[evaluation]`
# ---------------------------------------------------------------------------
[project.optional-dependencies]
evaluation = [
    "deepeval>=2.0.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hipaa_deidentifier"]

[tool.uv]
package = true
# Include both groups when developers run `uv sync` with no extra flags.
# The `eval` group provides deepeval + httpx + openpyxl needed by the
# PHI evaluation CLI.  Add `--no-group eval` to opt out (e.g. CI unit tests).
default-groups = ["dev", "eval"]

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

# ---------------------------------------------------------------------------
# Dependency groups — installed automatically by `uv sync` in development.
#
#   eval  — everything needed to run the PHI evaluation CLI and LLM judge.
#            Mirrors the `evaluation` optional extra via include-optional so
#            there is a single source of truth for these pins.
#
#   dev   — static analysis, type checking, and test tooling.
#            Install individually: `uv sync --group dev`
#            Install everything:   `uv sync` (all groups are on by default)
# ---------------------------------------------------------------------------
[dependency-groups]
eval = [
    "deepeval>=2.0.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.0",
]
dev = [
    "pyright>=1.1.409",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.5.0",
]
