[project]
name = "deid-patients"
version = "0.1.0"
description = "Patient data de-identification and dashboard tooling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "presidio-analyzer==2.2.355",
    "presidio-anonymizer==2.2.355",
    "spacy>=3.7.0",
    "transformers>=4.43.0",
    "torch>=2.2.0",
    "regex",
    "pyyaml",
    "tabulate",
    "dash==2.14.1",
    "plotly==5.17.0",
    "pandas==2.1.1",
    "dash-bootstrap-components==1.5.0",
]

[project.optional-dependencies]
evaluation = [
    "deepeval>=0.21.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pyright>=1.1.409",
]
